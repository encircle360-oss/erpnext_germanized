# Services of tests/site/run.sh: MariaDB and Redis for the test site, and the image under test as one-off
# bench containers, gunicorn backend and nginx frontend that share the sites volume.
# The passwords exist only for this throwaway site.
name: erpnext-germanized-site-test

x-db-root-password: &db-root-password site-test-root

x-image-under-test: &image-under-test
  image: ${SITE_TEST_IMAGE:?set SITE_TEST_IMAGE to the image under test}
  volumes:
    - sites:/home/frappe/frappe-bench/sites

services:
  db:
    image: mariadb:12.2
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
      # MariaDB 11.8 enables snapshot isolation, which fails a locking read of a row that another
      # transaction changed after the snapshot; Frappe does not expect that, and frappe_docker turns it off.
      - --innodb-snapshot-isolation=OFF
    environment:
      MARIADB_ROOT_PASSWORD: *db-root-password
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 24

  redis:
    image: redis:6.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  bench:
    <<: *image-under-test
    user: frappe
    working_dir: /home/frappe/frappe-bench
    environment:
      DB_ROOT_PASSWORD: *db-root-password
      ADMIN_PASSWORD: site-test-admin

  backend:
    <<: *image-under-test

  frontend:
    <<: *image-under-test
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      # nginx resolves every upstream at start; the test does not use Socket.IO, so the backend stands in.
      SOCKETIO: backend:9000

volumes:
  sites:
